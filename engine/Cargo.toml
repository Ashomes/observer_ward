[package]
name = "engine"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
base64 = "0.22.1"
#临时使用，最好将正则表达式迁移到支持regex库，减少反向引用
fancy-regex = { version = "0.16.2", default-features = false, features = [
    "std",
    "unicode",
    "perf",
] }
regex = { version = "1.12.2", default-features = false, features = [
    "std",
    "unicode",
    "perf",
] }
jsonpath-rust = "1.0.4"
rustc_lexer = "0.1.0"
serde_json = "1"
#git = "https://github.com/emo-crab/slinger",
slinger = { version = "0.2.9", features = [
    "serde",
    "cookie",
    "tls",
    "charset",
    "gzip",
    "schema"
] }
# TLS 后端依赖（同时支持 native-tls 和 rustls）
# 为解决 Linux（尤其是 musl/交叉编译）下 OpenSSL 发现失败问题，启用 vendored，内置编译 OpenSSL
native-tls = { version = "0.2", features = ["alpn", "vendored"] }
tokio-native-tls = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
webpki-roots = "0.26"
tokio = { version = "1", features = ["net", "io-util"] }
md-5 = "0.10.6"
tl = "0.7.8"
mime = "0.3.17"
thiserror = "2"
log = "0.4.28"
once_cell = "1.21.1"
schemars = { version = "1.0.4", optional = true, features = ["chrono04"] }
[features]
mcp = ["schemars"]
